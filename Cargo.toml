[package]
name = "samsung-tv-remote"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
iced = { version = "0.14", features = ["advanced", "canvas", "image", "tokio"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["net", "time", "sync", "rt-multi-thread", "macros", "io-util"] }
tokio-native-tls = "0.3"
tokio-tungstenite = "0.30"
futures-util = "0.3"
sha2 = "0.10"
base64 = "0.22"
url = "2"
security-framework = "3.7"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
